  <polygon points="128,56 184,92 128,128 72,92" fill="#9CCC65" stroke="#000000" stroke-width="6" />

  <!-- Left face -->
  <polygon points="72,92 128,128 128,192 72,156" fill="#66BB6A" stroke="#000000" stroke-width="6" />

  <!-- Right face -->
