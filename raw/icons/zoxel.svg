<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="56 40 144 176" role="img" aria-label="Zoxel icon">
  <!-- Cube faces with black outline -->
