# builds vulkan first (the flagship): windows x64, linux x64, linux arm, android arm; then opengl (the fallback): windows x64,
#  linux x64, linux arm, android arm (phone and xr); in ubuntu 24.04, the same as bsh/docker.sh (packages from bsh/deps.sh)
#   push / pull request: builds, zips are artifacts on the run's page
#   once a day: builds master and replaces the nightly release, skipped if master didn't change
name: build

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=true
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            nightly="$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)"
            [[ "${nightly}" == "${{ github.sha }}" ]] && changed=false
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # vulkan first, the flagship (doc/plans/vulkan.md): their zips carry shaderc beside the binary
          #  windows' own libs (its vulkan loader and shaderc are built, not the system's)
          - target: windows_x64_vulkan
            runner: ubuntu-latest
            deps: --windows --vulkan
            build: bash bsh/windows.sh --release --vulkan
          # linux's libs as their opengl twin's (vulkan and shaderc are the system's)
          - target: linux_x64_vulkan
            libs: linux_x64
            runner: ubuntu-latest
            deps: --vulkan
            build: bash bsh/build.sh --release --package --x64 --docker --vulkan
          # github's arm runner, built natively
          - target: linux_arm_vulkan
            libs: linux_arm
            runner: ubuntu-24.04-arm
            deps: --vulkan
            build: bash bsh/build.sh --release --package --arm --docker --vulkan
          # then opengl, the fallback
          - target: windows_x64
            runner: ubuntu-latest
            deps: --windows
            build: bash bsh/windows.sh --release
          - target: linux_x64
            runner: ubuntu-latest
            deps: ''
            build: bash bsh/build.sh --release --package --x64 --docker
          - target: linux_arm
            runner: ubuntu-24.04-arm
            deps: ''
            build: bash bsh/build.sh --release --package --arm --docker
    steps:
      - uses: actions/checkout@v7
      - name: packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y $(bash bsh/deps.sh ${{ matrix.deps }})
      - name: cache libs
        uses: actions/cache@v5
        with:
          path: |
            ext
            lib
          key: libs-${{ matrix.libs || matrix.target }}-${{ hashFiles('bsh/libs-download.sh', 'bsh/libs-compile.sh', 'bsh/deps.sh') }}
      - name: cache flecs
        uses: actions/cache@v5
        with:
          path: inc/flecs
          key: flecs-${{ hashFiles('bsh/flecs.sh', 'bsh/flecs_fix.sh', 'bsh/flecs_patches/*') }}
      - name: flecs
        run: bash bsh/flecs.sh
      - name: build
        run: ${{ matrix.build }}
      # the zip as it is (archive: false), not zipped again, named by its file
      - uses: actions/upload-artifact@v7
        with:
          path: zip/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  android:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - name: packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y $(bash bsh/deps.sh --android)
      - name: cache sdk
        uses: actions/cache@v5
        with:
          path: |
            and/sdk
            and/gradle
            ext
          key: android-${{ hashFiles('bsh/android_prepare.sh', 'bsh/libs-download.sh', 'bsh/xr.sh') }}
      - name: cache gradle
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('bsh/android_prepare.sh') }}
      - name: cache flecs
        uses: actions/cache@v5
        with:
          path: inc/flecs
          key: flecs-${{ hashFiles('bsh/flecs.sh', 'bsh/flecs_fix.sh', 'bsh/flecs_patches/*') }}
      - name: flecs
        run: bash bsh/flecs.sh
      - name: sdl3
        run: bash bsh/libs-download.sh --sdl3
      - name: sdk, ndk, gradle
        run: bash bsh/android_prepare.sh
      # signs with the repo's keystore if its secrets are set (doc/devops.md), else android.sh makes a new key
      - name: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [[ -z "${KEYSTORE}" ]] && { echo "no keystore secret, using a new key"; exit 0; }
          mkdir -p ~/.config/zox_keys
          echo "${KEYSTORE}" | base64 -d > ~/.config/zox_keys/zoxel.keystore
          printf '%s\n' "${KEYSTORE_PASSWORD}" > ~/.config/zox_keys/zoxel.password
      # vulkan first: builds the ndk's shaderc too (~10 minutes)
      - name: build vulkan
        run: bash bsh/android.sh zoxel --release --signed --vulkan
      # then opengl es, the phone and xr (xr is gl es only for now)
      - name: build
        run: bash bsh/android.sh zoxel --release --signed
      - name: build xr
        run: bash bsh/android.sh zoxel --release --signed --xr
      # each apk as it is (archive: false uploads one file)
      - uses: actions/upload-artifact@v7
        with:
          path: zip/zoxel_android_arm_vulkan_*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: zip/zoxel_android_arm_2*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: zip/zoxel_android_arm_xr_*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  nightly:
    needs: [build, android]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # skip-decompress: the zips stay zips (it unzipped our game zips into zips/)
      - uses: actions/download-artifact@v8
        with:
          path: zips
          skip-decompress: true
          merge-multiple: true
      # one release (tag nightly) with the newest builds, its files swapped: uploads first, then the old ones go,
      #  never deleted, a failed upload leaves the last builds there (versioned releases come later)
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha="${{ github.sha }}"
          gh release view nightly > /dev/null 2>&1 || \
            gh release create nightly --prerelease --target "${sha}" --title "zoxel-nightly" --notes "first build"
          gh release upload nightly zips/* --clobber
          new=" $(cd zips && echo *) "
          gh release view nightly --json assets --jq '.assets[].name' | while read -r name; do
            [[ "${new}" == *" ${name} "* ]] || gh release delete-asset nightly "${name}" --yes
          done
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/nightly" -f sha="${sha}" -F force=true > /dev/null
          gh release edit nightly --title "zoxel-nightly" --notes "daily build of master, $(date -u +%Y-%m-%d), at ${sha}"
